<template id="principles">
<h2>How the suite works: principles</h2>

<h3>The two halves of a case</h3>
<p>A <b>case</b> is one file, <code>tests/testthat/test-case_&lt;name&gt;.R</code>, about one scenario. It holds two kinds of thing:</p>
<ul>
  <li><b>Expectations</b> are ordinary testthat checks that pass or fail on their own: the plotted line equals the model's prediction, this warning is raised, the plot still builds. They never need review. They ship with the package, so CRAN runs them.</li>
  <li><b>Judged outputs</b> are anything that needs a reviewer's eye: how a plot looks, how a message is worded, how a widget feels to use. A case declares each one with <code>judged_output()</code>, which does nothing under R CMD check.</li>
</ul>
<p>If a case's expectations fail, its judged outputs aren't looked at at all: the review state stays exactly as it was.</p>

<h3>What a fingerprint decides, and what it doesn't</h3>
<p>Each judged output is turned into text that leaves out noise (fixed-font SVG for a plot, the message text for conditions, the figure and its settings for a widget). Its <b>fingerprint</b> is a short hash of that text.</p>
<ul>
  <li>A fingerprint <b>never decides whether an output is right</b>. Only an expectation or a reviewer does that.</li>
  <li>It only decides whether an output <b>keeps its review status</b>: same fingerprint, status kept; new fingerprint, back to Unreviewed. So you only see things that actually changed.</li>
  <li>An interactive output has one fingerprint for the whole thing, taken from what its page is built from. Its states (camera angles, slider positions) are only pictures for review.</li>
</ul>

<h3>Review statuses, and who can set each</h3>
<table>
  <tr><th>Status</th><th>Meaning</th><th>Set by</th></tr>
  <tr><td><span class="pill s-agent">Unreviewed</span></td><td>New or changed; nobody has looked yet.</td><td>The runner, whenever a fingerprint is new.</td></tr>
  <tr><td><span class="pill s-you">Agent approved</span></td><td>An agent looked and wrote a note. Now waiting for you.</td><td>An agent, with <code>suite.R approve</code>. A note is required.</td></tr>
  <tr><td><span class="pill s-approved">Human approved</span></td><td>You approved this exact fingerprint. The only final status.</td><td>Only you, on this page.</td></tr>
  <tr><td><span class="pill s-rejected">Rejected</span></td><td>Sent back with a note, until the code changes the fingerprint.</td><td>An agent (from Unreviewed) or you (from Agent approved). A note is required.</td></tr>
</table>
<p>You never see an output before an agent has approved it. Your decisions are kept in their own file, <code>human_decisions.json</code>, which only this page's server writes. A Claude Code hook stops agents from writing to it. A decision counts only for the fingerprint you judged: if the output changes, it's Unreviewed again, with nothing to undo.</p>

<h3>How the suite's own tests are tested</h3>
<ul>
  <li><b>Unit tests</b> (<code>Rscript tests/suite/test.R</code>) cover the suite's machinery: the status rules, laid out row by row against the spec's table; text normalisation; the runner; the review server's rules; and the hook.</li>
  <li><b>Trust tests</b>, written once for every output type: the views are drawn from exactly what was hashed (completeness), changing any one input changes the fingerprint (sensitivity), and two fresh builds agree (stability). A made-up output type defined only in a test file goes all the way to this page, to prove new kinds of output fit without changes to the core.</li>
  <li>The <b>mutation check</b> (<code>Rscript tests/suite/mutate.R</code>) breaks the suite on purpose, one rule at a time, in a copy, and checks that the unit tests notice. Every break must be caught. It takes a while, but you only need it after the suite itself changes: the <a href="?view=health" data-go="health">suite health</a> page shows the latest result and says whether it's out of date. Adding cases never makes it out of date; changing the suite's code, its unit tests, a type or a type's demo case does. To keep it off your machine, run the <i>mutation-check</i> workflow on GitHub Actions (see the tests README for how to start it): it splits the breaks across several runners, and the <code>mutation-report</code> file it leaves is the report to commit.</li>
</ul>

<h3>What CI and CRAN run</h3>
<ul>
  <li><b>CRAN</b> runs only the expectations, within its time and two-thread limits. Judged outputs do nothing there.</li>
  <li><b>CRAN</b> takes about 35 seconds for the expectations under <code>R CMD check</code>.</li>
  <li><b>CI</b> (GitHub Actions, on pushes to the test-suite branch) runs every case on Windows, macOS and Ubuntu with pinned package versions, and checks each output's fingerprint against the one recorded on your machine. Your machine's fingerprints count everywhere: in the cross-platform experiment, all 143 outputs matched on all three. Human approved passes, Agent approved passes with a warning, and Unreviewed, Rejected or a failing expectation fails the run.</li>
  <li>If an output ever comes out differently on one platform, that's a <b>platform variant</b>. CI uploads its forms and views for download. If you approved the original, an agent can approve the variant with a note on what differs, and you don't need to look again.</li>
  <li>The <b>release check</b> (<code>Rscript tests/suite/release.R</code>, on your machine, before a CRAN submission) fails until everything is Human approved. It also re-renders every state and compares it with the screenshot kept when you approved it. A difference there means the fingerprint missed something: a suite bug.</li>
</ul>

<h3>From run to Human approved</h3>
<ol>
  <li><b>Run.</b> <code>Rscript tests/suite/suite.R run</code> runs every case. If its expectations pass, each judged output goes through its output type: it's serialised, normalised and fingerprinted, and the form is saved under <code>forms/</code>.</li>
  <li><b>Compare.</b> Same fingerprint as recorded: the status is kept and nothing else happens. New fingerprint: the output becomes <b>Unreviewed</b> and its views are rendered, so an agent can look at what it can't operate.</li>
  <li><b>Agent pass.</b> An agent runs <code>suite.R list</code>, reads <code>suite.R diff &lt;id&gt;</code> and the views, then approves or rejects with a note. Approval makes it <b>Agent approved</b> and puts it in your queue.</li>
  <li><b>You.</b> This page shows it with its expected behaviour, the agent's note, and a comparison with the last version you approved. Approve, or reject with a note for the agent. The server checks the move is allowed and records it in <code>human_decisions.json</code>; an approval also keeps this version's form and views as the new comparison point.</li>
  <li><b>Next run.</b> Unchanged: still <b>Human approved</b>. Changed: <b>Unreviewed</b> again, and the cycle repeats.</li>
</ol>

<h3>Output types</h3>
<p>Every kind of judged output is one registration in its own file under <code>tests/suite/types/</code>: how to turn the object into text parts, which states a reviewer sees, how to draw each state, and how this page shows it (an image with comparison, a text diff, or states side by side plus the live widget). The runner, the review state and this page never name a type, so a new kind of output (sliders, animations) is added by writing one file. Registered now: static ggplot, base graphics, condition text, returned text (equations, subtitles, labels), and plotly 3D.</p>

<h3>The behaviour inventory</h3>
<p><code>for_devs/behaviour_inventory.yml</code> lists what each function must do and the edge cases that come up, each with a stable ID. Cases cite the IDs they cover with <code>covers()</code>. The <a href="?view=inventory" data-go="inventory">inventory page</a> shows which cases cover each entry, what's deferred and why, and what's not covered yet; each case shows its expected behaviour from the entries it cites. The inventory is temporary: it's deleted at the end of the test-suite revision.</p>
