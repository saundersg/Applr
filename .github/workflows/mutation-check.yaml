# The suite's mutation check (tests/suite/mutate.R), split across runners and
# started by hand. Each shard runs its share of the breaks plus the unbroken
# copy; the last job merges their reports into mutation_report.json, uploads
# it, and fails if any break was missed or crashed.
on:
  workflow_dispatch:
    inputs:
      shards:
        description: Runners to split the breaks across
        type: number
        default: 8
      full:
        description: Run every test in every broken copy (--full)
        type: boolean
        default: false

name: mutation-check

permissions: read-all

jobs:
  plan:
    if: github.repository == 'jamesbeeson01/Applr'
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - id: list
        run: echo "shards=$(jq -nc --argjson n '${{ inputs.shards }}' '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"

  shard:
    needs: plan
    runs-on: ubuntu-latest
    name: shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true

      # The project .Rprofile would shadow setup-r's, which sets the CRAN mirror.
      # Hidden from git, so the report's commit isn't marked as changed.
      - name: Drop project .Rprofile
        run: git update-index --skip-worktree .Rprofile && rm .Rprofile

      # Bump the suffix when the packages installed below change.
      - uses: actions/cache@v4
        id: cache
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-lib-${{ runner.os }}-4.5.3-${{ hashFiles('tests/suite/pins/versions.csv') }}-v1

      # chromote drives the preinstalled Chrome for the plotly contract tests'
      # screenshots; httpuv, png and yaml are used by the suite but not pinned.
      - name: Install pinned packages
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          Rscript -e 'install.packages("pak")'
          Rscript tests/suite/pins/install.R
          Rscript -e 'pak::pkg_install(c("chromote", "httpuv", "png", "yaml"), upgrade = FALSE, ask = FALSE)'

      # Chrome's first start on a runner can be slow (fonts the install added).
      # Taking it alone here keeps the copies' Chromes within their timeout.
      - name: Start Chrome once
        run: |
          chrome=$(Rscript -e 'cat(chromote::find_chrome())')
          "$chrome" --version
          Rscript -e 'b <- chromote::ChromoteSession$new(); b$close()' && exit 0
          timeout 30 "$chrome" --headless --disable-gpu --remote-debugging-port=9333 about:blank 2>&1 | tail -40
          exit 1

      - name: Mutation check
        run: Rscript tests/suite/mutate.R 4 --shard ${{ matrix.shard }}/${{ inputs.shards }} ${{ inputs.full && '--full' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: tests/suite/mutation_shards
          if-no-files-found: ignore

  merge:
    needs: shard
    if: ${{ !cancelled() && needs.shard.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true

      - name: Drop project .Rprofile
        run: git update-index --skip-worktree .Rprofile && rm .Rprofile

      - name: Install jsonlite
        run: Rscript -e 'install.packages("jsonlite")'

      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-shard-*
          path: shards

      # The committed report goes first, so a failed merge uploads nothing stale.
      - name: Merge shard reports
        run: |
          rm tests/suite/mutation_report.json
          Rscript tests/suite/mutate.R --merge shards

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: tests/suite/mutation_report.json
          if-no-files-found: ignore
