# The judged-output suite's CI check (tests/suite/ci.R, spec: "CI"). Runs on
# pushes to the test-suite branch, on saundersg/Applr only. Each
# platform installs the pinned versions, compares every fingerprint with the
# committed review state, and fails, warns or passes by review status. Forms
# and views of any platform variant are uploaded as the run's artifact.
on:
  push:
    branches: [test-suite-revision]
  workflow_dispatch:

name: judged-outputs

permissions: read-all

jobs:
  check:
    if: github.repository == 'saundersg/Applr'
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        # macOS on Intel: in November 2026 the arm64 macos-latest jobs often
        # waited 15 minutes and were never given a runner.
        include:
          - {os: windows-latest,  platform: gha-windows}
          - {os: macos-15-intel,  platform: gha-macos}
          - {os: ubuntu-latest,   platform: gha-ubuntu}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      APPLR_SUITE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true

      # The project .Rprofile would shadow setup-r's, which sets the CRAN mirror.
      - name: Drop project .Rprofile
        shell: bash
        run: rm .Rprofile

      - name: Install pinned packages
        run: |
          Rscript -e 'install.packages("pak")'
          Rscript tests/suite/pins/install.R

      # Only for screenshots of a variant's interactive states; never fingerprinted.
      - name: Install chromote
        continue-on-error: true
        run: Rscript -e 'pak::pkg_install("chromote", upgrade = FALSE, ask = FALSE)'

      - name: Check judged outputs
        run: Rscript tests/suite/ci.R results/${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-${{ matrix.platform }}
          path: results/${{ matrix.platform }}
