# TEMPORARY. Salvage audit (ticket 4): what each part of the old suite, kept
# in the `old-suite` tag, put the functions through, and whether the new
# suite does too. The clean-up step deletes this file. The review page's
# "Salvage audit" view reads it; the maintainer's verdicts on it go to
# tests/suite/salvage_review.json, written only by the review server.
#
#   additions:   each test written because of the audit
#     id:        stable, lower case
#     case:      the case file it is in (test-case_<case>.R)
#     tests:     expectation() or judged output names in that file
#     entries:   inventory IDs it covers
#     why:       the situation the old suite had that the new one lacked
#   old:         one line per old case, testthat test and file
#     verdict:   covered | added | discarded
#     by:        new cases that cover it (covered)
#     added:     addition IDs written for it (added)
#     note:      one line

additions:
  - id: every-engine-back-transform
    case: num_model_shapes
    tests: ["every_engine_inverts"]
    entries: [shared.back-transform.every-engine]
    why: exp(y) and y^2 responses were untested, and they take their own branches of the inverse (unary exp, binary ^). Only log was checked in slice_2d().
  - id: one-predictor-x-expression
    case: num_model_shapes
    tests: ["one_predictor_expression"]
    entries: [shared.composite-x.one-predictor]
    why: aes(log(x)), aes(x^2) and aes(1/x) take the composite path although they name one predictor; only several-predictor expressions were tested.
  - id: factor-in-formula-pinned
    case: num_model_shapes
    tests: ["formula_factor_pinned"]
    entries: [shared.slicing.factor-in-formula-pinned]
    why: as.factor(x) in the formula is the commonest model shape in the student analyses; only its imputation bug was pinned, not the way it works.
  - id: dot-formula
    case: num_model_shapes
    tests: ["dot_formula"]
    entries: [shared.model-data.dot-formula]
    why: Seen in the student analyses; nothing tested a formula whose predictors aren't written out.
  - id: two-aesthetics
    case: num_model_shapes
    tests: ["two_aesthetics"]
    entries: [shared.slicing.two-aesthetics]
    why: Colour and linetype were tested one at a time, never together on two predictors.
  - id: numeric-facet
    case: num_model_shapes
    tests: ["numeric_facet"]
    entries: [shared.slicing.numeric-facet]
    why: Facet pinning was checked only for a character predictor; a numeric one goes through a different coercion.
  - id: full-range-beyond-data
    case: num_model_shapes
    tests: ["full_range_past_data"]
    entries: [geom_slice.full-range-beyond-data]
    why: full_range was checked only where the panel equals the data range, so prediction past the data was never seen.
  - id: autoplot-transformed
    case: num_model_shapes
    tests: ["autoplot_transformed_axes"]
    entries: [autoplot.transformed-terms]
    why: autoplot() was tested only on untransformed models.
  - id: autoplot-local-data
    case: num_model_shapes
    tests: ["autoplot_local_data"]
    entries: [autoplot.local-data]
    why: Recovery through the formula's environment was tested for geom_slice() without data, never for autoplot() with data in a local scope.
  - id: outside-domain-silent
    case: num_model_shapes
    tests: ["outside_domain_known_issue"]
    entries: [shared.back-transform.outside-domain]
    why: Nothing evaluated a back-transform outside its domain. A y^2 model with negative predictions loses those points; slice_2d() says nothing, geom_slice() only ggplot2's "Removed rows" at draw time. Pinned as a known issue.
  - id: log-of-negative-prediction
    case: cond_boundaries
    tests: ["log_of_negative_prediction"]
    entries: [shared.back-transform.outside-domain]
    why: The same boundary for exp(y), where the user sees base R's bare "NaNs produced". Its wording is judged.
  - id: interval-from-two-rows
    case: cond_boundaries
    tests: ["interval_from_two_rows"]
    entries: [shared.intervals.no-residual-df]
    why: Very small datasets; an interval with no residual degrees of freedom gives the same bare warning. Its wording is judged.
  - id: every-entry-point
    case: cond_boundaries
    tests: ["every_entry_point_same"]
    entries: [shared.validation.every-entry-point]
    why: The old suite refused bad models and arguments in every engine; the new one only through geom_slice(). This found scatter_3d()'s hint naming geom_slice(), pinned as a known bug.
  - id: latex-factor-styles
    case: text_equation_shapes
    tests: ["factor_terms", "latex_factor_styles",
            "formula_factor_names"]
    entries: [lm_latex.factor-styles, lm_equation.response-and-term-names]
    why: lm_latex() was tested on numeric terms only; factor labels in LaTeX, and factor(cyl) or as.factor(am) term names, were never looked at. Their wording is judged.
  - id: equation-names
    case: text_equation_shapes
    tests: ["names_as_written"]
    entries: [lm_equation.response-and-term-names]
    why: Equations of 1/y, sqrt(y), exp(y) and y^2 responses, and of x:z and I(x * z) terms, were never checked.
  - id: subtitle-equation-only
    case: text_equation_shapes
    tests: ["nothing_held_no_line"]
    entries: [geom_slice_subtitle.held-line]
    why: The inventory says the held line is dropped when nothing is held, but no case checked it with the equation shown.
  - id: style-pinned
    case: text_equation_shapes
    tests: ["pinned_style_kept"]
    entries: [geom_slice_subtitle.style-pinned]
    why: The escape hatch from the narrow-width brackets fallback was untested.

